services:
  live-photo-tool:
    build: .
    # Apple Silicon 主机如遇 HEIC/FFmpeg 兼容问题，可改为 linux/amd64
    # platform: linux/amd64
    ports:
      - "8080:8080"
    volumes:
      - ./workspace:/app/workspace
      # 持久化网页导入的 LUT，也可直接把 .cube 放入 ./my-luts
      - ./my-luts:/app/luts/user
    environment:
      - MAX_UPLOAD_SIZE_GB=4
      - SESSION_TIMEOUT_HOURS=1
    restart: unless-stopped
