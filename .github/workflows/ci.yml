name: CI

# 推送到 main、以及针对 main 的 PR 时触发；也支持手动触发
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的新推送取消正在跑的旧 run，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-check:
    name: Frontend · 类型检查、测试与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装 pnpm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查、测试与构建
        run: |
          pnpm exec tsc --noEmit
          pnpm test
          pnpm run build

  backend-check:
    name: Backend · 语法检查与测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖（ffmpeg）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: 安装 uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: 同步依赖
        run: uv sync --frozen --all-groups

      - name: 语法检查与测试
        run: |
          uv run python -m compileall -q app/
          uv run pytest -v

  docker-build:
    name: Docker · 镜像构建验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建镜像（利用层缓存，加载进 daemon，不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true            # 加载进本地 daemon，供下一步冒烟使用
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: live-photo-tool:ci

      - name: 验证镜像中的 FFmpeg、FastAPI、内置 LUT 和静态资源
        run: |
          docker run --rm live-photo-tool:ci sh -ec '
            command -v ffmpeg >/dev/null
            ffmpeg -version | head -1
            python -c "import fastapi, app.main; print(\"fastapi\", fastapi.__version__)"
            python -c "from app.main import app; assert sum(lut.source == \"builtin\" for lut in app.state.luts.list()) == 4"
            test -s /app/luts/builtin/LICENSE.txt
            test -f /app/static/index.html
          '
