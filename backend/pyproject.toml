[project]
name = "live-photo-tool"
version = "0.1.0"
description = "LOG 视频套 LUT + 导出 Live Photo 的本地 Web 工具"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.18",
    "pydantic>=2.10",
    "pillow>=11.3",
    "pillow-heif>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
